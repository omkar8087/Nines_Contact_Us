<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9NINES Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="nines.css">
</head>
<body>

<div class="main-wrapper">
    <div class="logo-container">
        <div class="logo-circle">
            <span class="logo-text">NINES</span>
        </div>
    </div>

    <div class="content-container">
        <div class="link-row" id="instagram">
            <div class="icon-circle insta"><i class="fab fa-instagram"></i></div>
            <div class="label-pill">9NINES_INDIA</div>
        </div>

        <div class="link-row" id="whatsapp">
            <div class="icon-circle whatsapp"><i class="fab fa-whatsapp"></i></div>
            <div class="label-pill">WHATSAPP</div>
        </div>

        <div class="link-row" id="email">
            <div class="icon-circle email"><i class="fas fa-envelope"></i></div>
            <div class="label-pill">GMAIL</div>
        </div>

        <div class="link-row" id="phone">
            <div class="icon-circle phone"><i class="fas fa-phone"></i></div>
            <div class="label-pill">PHONE</div>
        </div>
    </div>
</div>

<script src="nines.js"></script>
</body>
</html>
